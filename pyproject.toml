[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "que-como"
version = "0.1.0"
description = "Plataforma ¿Qué Como? para búsqueda, comparación y evaluación de restaurantes"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/que_como"]

[tool.coverage.report]
show_missing = true
